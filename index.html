<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Link...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #30363d;
      border-top: 4px solid #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    a.btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Opening in browser...</h2>
  <p>If you are not redirected automatically, tap the button below:</p>
  <a id="fallback-btn" class="btn" href="#">Continue</a>

  <script>
    // 1. ADD ALL YOUR LINKS HERE:
    // "key": "destination URL"
    const linkMap = {
      "shruti": "https://www.creatorfarm.in/darlingshruti",
      // You can add more keys here anytime, e.g.:
      // "of": "https://onlyfans.com/yourpage",
      // "store": "https://yourstore.com"
    };

    // 2. Read the parameter ?to=... from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get("to");

    // Match link or use default
    const targetUrl = linkMap[key] || "https://www.creatorfarm.in/darlingshruti";

    // Set fallback button link
    const fallbackBtn = document.getElementById("fallback-btn");
    fallbackBtn.href = targetUrl;

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const cleanUrl = targetUrl.replace(/^https?:\/\//, "");

    // 3. Force Android Chrome Intent Escape
    if (/android/i.test(ua)) {
      window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
    } else {
      // 4. iOS / Desktop fallback
      window.location.href = targetUrl;
    }
  </script>
</body>
</html>
